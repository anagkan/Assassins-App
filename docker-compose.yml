services:
  app:
    # Prebuilt by .github/workflows/docker.yml. `docker compose pull` fetches it;
    # `docker compose up -d --build` builds it locally instead (needs 2 GB+ RAM).
    image: ${APP_IMAGE:-ghcr.io/anagkan/assassins-app:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-America/New_York}
      # Keep Node's heap small enough for a 1 GB server.
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - data:/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
